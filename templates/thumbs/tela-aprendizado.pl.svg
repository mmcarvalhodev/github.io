<rect class="bg" width="800" height="500" rx="14"/>
<rect class="brd" x="1" y="1" width="798" height="498" rx="14"/>
<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Kanwa nauki</text><text class="p" x="40" y="132">Nauczyć się to umieć wyjaśnić i zastosować. Dwie ostatnie sekcje utrwalają.</text><text class="h2" x="40" y="156">Temat</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Streszczenie własnymi słowami</text><text class="p" x="40" y="234">Kopiowanie nie utrwala. Przepisanie własnymi słowami pokazuje, gdzie rozumienie się z…</text><text class="h2" x="40" y="258">Pytania otwarte</text><rect x="40" y="274" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="310">Przykłady</text><rect x="40" y="326" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="362">Powiązania</text><text class="p" x="40" y="388">Do czego to podobne w tym, co już wiesz. Tak wiedza się przykleja.</text><text class="h2" x="40" y="412">Działanie</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

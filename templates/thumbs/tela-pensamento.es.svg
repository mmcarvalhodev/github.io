<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Lienzo de Pensamiento</text><text class="p" x="40" y="132">Para pensar por escrito antes de decidir. Separar hecho de suposición ya es la mitad …</text><text class="h2" x="40" y="156">Problema</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Hechos conocidos</text><text class="p" x="40" y="234">Solo lo que puedes sostener. Si necesita un &quot;creo que&quot;, va en la sección de abajo.</text><text class="h2" x="40" y="258">Suposiciones</text><text class="p" x="40" y="284">Lo que das por cierto sin haber verificado. Marcarlo evita construir sobre arena.</text><text class="h2" x="40" y="308">Alternativas</text><rect x="40" y="324" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="360">Decisión</text><rect x="40" y="376" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="412">Próximo paso</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

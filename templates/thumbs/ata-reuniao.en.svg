<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Meeting Notes</text><text class="p" x="40" y="132">Write during the meeting, not after. What goes unrecorded tends to become another mee…</text><text class="h2" x="40" y="156">Date and attendees</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Agenda</text><text class="p" x="40" y="234">The points to cover, in order. Agreeing on this beforehand keeps the meeting from dri…</text><text class="h2" x="40" y="258">What was discussed</text><rect x="40" y="274" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="310">Decisions made</text><text class="p" x="40" y="336">What was decided, and why. Writing down the reason saves you from re-arguing it later.</text><text class="h2" x="40" y="360">Tasks and owners</text><text class="p" x="40" y="386">Every task with a name and a date. A task without an owner is not a task.</text><text class="h2" x="40" y="410">Next meeting</text><rect x="40" y="426" width="560" height="1" fill="#E8E8E8"/>
</svg>

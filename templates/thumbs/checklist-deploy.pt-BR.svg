<text class="h1" x="40" y="96">Checklist de Publicação</text><text class="p" x="40" y="132">A lista existe para o dia em que algo der errado às onze da noite — escreva pensando …</text><text class="h2" x="40" y="156">Antes</text><text class="p" x="40" y="182">Testes passando, backup feito, aviso enviado, janela combinada.</text><text class="h2" x="40" y="206">Durante</text><rect x="40" y="222" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="258">Depois</text><text class="p" x="40" y="284">O que conferir para saber que está de pé de verdade, e não apenas que subiu.</text><text class="h2" x="40" y="308">Plano de retorno</text><text class="p" x="40" y="334">Como voltar atrás, e em quanto tempo. Sem resposta para isto, ainda não está pronto p…</text><rect x="40" y="348" width="560" height="1" fill="#E8E8E8"/>

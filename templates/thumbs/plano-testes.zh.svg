<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">测试计划</text><text class="p" x="40" y="132">说明哪些不测，和列出要测的同样重要——它统一了预期。</text><text class="h2" x="40" y="156">范围</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">将要测试的内容</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">不会测试的内容</text><text class="p" x="40" y="286">以及原因：风险低、成本高，或已在别处覆盖。</text><text class="h2" x="40" y="310">场景</text><text class="p" x="40" y="336">情境、操作、预期结果。每行一条。</text><text class="h2" x="40" y="360">通过标准</text><rect x="40" y="376" width="560" height="1" fill="#E8E8E8"/><rect x="40" y="402" width="560" height="1" fill="#E8E8E8"/>
</svg>

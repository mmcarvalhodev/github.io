<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Kiến trúc Phần mềm</text><text class="p" x="40" y="132">Tấm bản đồ người mới đọc trước khi chạm vào mã. Vài khối được giải thích kỹ tốt hơn m…</text><text class="h2" x="40" y="156">Tổng quan</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Thành phần</text><text class="p" x="40" y="234">Mỗi phần làm gì và, quan trọng hơn, không làm gì.</text><text class="h2" x="40" y="258">Luồng dữ liệu</text><text class="p" x="40" y="284">Thông tin vào từ đâu, lưu ở đâu và đi ra bằng đường nào.</text><text class="h2" x="40" y="308">Quyết định kỹ thuật</text><text class="p" x="40" y="334">Những lựa chọn định hình mọi thứ còn lại. Mỗi cái xứng đáng có bản ghi quyết định riê…</text><text class="h2" x="40" y="358">Rủi ro</text><rect x="40" y="374" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="410">Điều chưa được giải quyết</text><rect x="40" y="426" width="560" height="1" fill="#E8E8E8"/>
</svg>

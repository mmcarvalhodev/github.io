<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">AI 작업 캔버스</text><text class="p" x="40" y="132">캔버스 하나에 한 사이클: 요청, 수신, 평가, 결정. AI를 쓸 때 사라지는 것은 바로 판단의 기록입니다.</text><text class="h2" x="40" y="156">목적</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">맥락</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">프롬프트</text><rect x="40" y="276" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="312">결과</text><rect x="40" y="328" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="364">평가</text><text class="p" x="40" y="390">잘 나온 것, 틀린 것, 지어낸 것. 사용을 배움으로 바꾸는 것이 바로 이 항목입니다.</text><text class="h2" x="40" y="414">결정</text><rect x="40" y="430" width="560" height="1" fill="#E8E8E8"/>
</svg>

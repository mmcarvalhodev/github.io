<rect class="bg" width="800" height="500" rx="14"/>
<rect class="brd" x="1" y="1" width="798" height="498" rx="14"/>
<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Deployment-Checkliste</text><text class="p" x="40" y="132">Die Liste existiert für den Abend, an dem um elf etwas schiefgeht — schreiben Sie sie…</text><text class="h2" x="40" y="156">Vorher</text><text class="p" x="40" y="182">Tests grün, Backup erstellt, Ankündigung versendet, Zeitfenster vereinbart.</text><text class="h2" x="40" y="206">Währenddessen</text><rect x="40" y="222" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="258">Danach</text><text class="p" x="40" y="284">Was zu prüfen ist, um zu wissen, dass es wirklich läuft — nicht nur, dass es ausgerol…</text><text class="h2" x="40" y="308">Rollback-Plan</text><text class="p" x="40" y="334">Wie man zurückrollt und wie lange das dauert. Ohne Antwort darauf ist es nicht bereit.</text><rect x="40" y="348" width="560" height="1" fill="#E8E8E8"/>
</svg>

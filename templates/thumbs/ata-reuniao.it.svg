<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Verbale di Riunione</text><text class="p" x="40" y="132">Scrivi durante la riunione, non dopo. Ciò che non viene registrato di solito diventa …</text><text class="h2" x="40" y="156">Data e partecipanti</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Ordine del giorno</text><text class="p" x="40" y="234">I punti da trattare, in ordine. Concordarlo prima evita che la riunione divaghi.</text><text class="h2" x="40" y="258">Cosa è stato discusso</text><rect x="40" y="274" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="310">Decisioni prese</text><text class="p" x="40" y="336">Cosa è stato deciso e perché. Annotare il motivo evita di ridiscutere la stessa cosa …</text><text class="h2" x="40" y="360">Attività e responsabili</text><text class="p" x="40" y="386">Ogni attività con un nome e una data. Un’attività senza responsabile non è un’attivit…</text><text class="h2" x="40" y="410">Prossima riunione</text><rect x="40" y="426" width="560" height="1" fill="#E8E8E8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<style>
  .bg{fill:#FFFFFF}
  .brd{fill:none;stroke:#E6E6E6;stroke-width:2}
  .ttl{font:700 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#141414}
  .sub{font:400 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#8A8A8A}
  .hdr{font:700 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#FFFFFF}
  .cel{font:400 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#333333}
  .celb{font:700 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#222222}
  .h1{font:700 22px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#141414}
  .h2{font:700 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#222222}
  .p{font:400 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#9A9A9A}
  .tag{font:700 11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#FF6600;letter-spacing:1px}
</style>
<rect class="bg" width="800" height="500" rx="14"/>
<rect class="brd" x="1" y="1" width="798" height="498" rx="14"/>
<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Шаблон промпта</text><text class="p" x="40" y="132">Заполните разделы ниже. Чем яснее роль, контекст и ожидаемый формат, тем лучше ответ …</text><text class="h2" x="40" y="156">Роль</text><text class="p" x="40" y="182">Кем должен быть ИИ, когда отвечает. Например: придирчивый технический рецензент, терп…</text><text class="h2" x="40" y="206">Контекст</text><text class="p" x="40" y="232">Что нужно знать до начала: проект, аудитория, что уже пробовали, что менять нельзя.</text><text class="h2" x="40" y="256">Задача</text><text class="p" x="40" y="282">Что вам нужно — одним прямым предложением. Одна просьба на промпт обычно работает луч…</text><text class="h2" x="40" y="306">Формат ответа</text><text class="p" x="40" y="332">В каком виде нужен ответ: таблица, список, сплошной текст, сколько слов, на каком язы…</text><text class="h2" x="40" y="356">Ограничения</text><text class="p" x="40" y="382">Чего избегать: жаргон, догадки без источника, менять уже решённое, превышать объём.</text><text class="h2" x="40" y="406">Пример ожидаемого результата</text><text class="p" x="40" y="432">Короткий пример желаемого результата. Это улучшает ответ сильнее всего — и чаще всего…</text>
</svg>

<text class="tag" x="40" y="44">NODUS WORKSPACE · PLANILHA</text>
<text class="ttl" x="40" y="90">व्यय ट्रैकर</text><text class="sub" x="40" y="118">हर खर्च को एक पंक्ति में लिखें। दाईं ओर का सारांश श्रेणी के अनुसार खुद जोड़ देता है।</text><rect x="40" y="132" width="720" height="30" fill="#FF6600" rx="3"/><text class="hdr" x="48" y="152">तारीख</text><text class="hdr" x="129.64948453608247" y="152">विवरण</text><text class="hdr" x="322.63917525773195" y="152">श्रेणी</text><text class="hdr" x="433.97938144329896" y="152">भुगतान</text><text class="hdr" x="545.319587628866" y="152">राशि</text><text class="hdr" x="641.8144329896907" y="152">श्रेणी अनुसार …</text><rect x="40" y="162" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="129.64948453608247" y="182">उदाहरण: सप्ताह का किराना</text><text class="cel" x="322.63917525773195" y="182">भोजन</text><text class="cel" x="433.97938144329896" y="182">डेबिट कार्ड</text><text class="cel" x="545.319587628866" y="182">0</text><text class="cel" x="641.8144329896907" y="182">आवास</text><text class="cel" x="641.8144329896907" y="212">भोजन</text><rect x="40" y="222" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="641.8144329896907" y="242">परिवहन</text><text class="cel" x="641.8144329896907" y="272">स्वास्थ्य</text><rect x="40" y="282" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="641.8144329896907" y="302">शिक्षा</text><text class="cel" x="641.8144329896907" y="332">मनोरंजन</text><rect x="40" y="342" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="641.8144329896907" y="362">सदस्यताएँ</text><text class="cel" x="641.8144329896907" y="392">अन्य</text><rect x="40" y="132" width="720" height="270" fill="none" stroke="#EDEDED"/>

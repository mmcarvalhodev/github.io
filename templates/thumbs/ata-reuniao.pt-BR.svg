<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Ata de Reunião</text><text class="p" x="40" y="132">Escreva durante a reunião, não depois. O que não fica registrado costuma virar outra …</text><text class="h2" x="40" y="156">Data e participantes</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Pauta</text><text class="p" x="40" y="234">Os pontos a tratar, em ordem. Combinar isto antes evita a reunião derivar.</text><text class="h2" x="40" y="258">O que foi discutido</text><rect x="40" y="274" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="310">Decisões tomadas</text><text class="p" x="40" y="336">O que ficou decidido, e por quê. Registrar o motivo evita rediscutir a mesma coisa de…</text><text class="h2" x="40" y="360">Tarefas e responsáveis</text><text class="p" x="40" y="386">Cada tarefa com um nome e uma data. Tarefa sem dono não é tarefa.</text><text class="h2" x="40" y="410">Próxima reunião</text><rect x="40" y="426" width="560" height="1" fill="#E8E8E8"/>
</svg>

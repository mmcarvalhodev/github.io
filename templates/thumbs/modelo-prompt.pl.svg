<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Szablon promptu</text><text class="p" x="40" y="132">Wypełnij poniższe sekcje. Im jaśniejsza rola, kontekst i oczekiwany format, tym lepsz…</text><text class="h2" x="40" y="156">Rola</text><text class="p" x="40" y="182">Kim ma być AI, gdy odpowiada. Np. wymagający recenzent techniczny, cierpliwy nauczyci…</text><text class="h2" x="40" y="206">Kontekst</text><text class="p" x="40" y="232">Co musi wiedzieć przed startem: projekt, odbiorcy, co już próbowano, czego nie wolno …</text><text class="h2" x="40" y="256">Zadanie</text><text class="p" x="40" y="282">Czego chcesz, w jednym zdaniu. Jedna prośba na prompt zwykle daje więcej niż pięć nar…</text><text class="h2" x="40" y="306">Format odpowiedzi</text><text class="p" x="40" y="332">Jak ma wyglądać odpowiedź: tabela, lista, tekst ciągły, ile słów, w jakim języku.</text><text class="h2" x="40" y="356">Ograniczenia</text><text class="p" x="40" y="382">Czego unikać: żargonu, założeń bez źródła, zmieniania tego, co ustalone, przekraczani…</text><text class="h2" x="40" y="406">Przykład oczekiwanego wyniku</text><text class="p" x="40" y="432">Krótki przykład oczekiwanego wyniku. Najbardziej poprawia odpowiedź i najczęściej byw…</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<style>
  .bg{fill:#FFFFFF}
  .brd{fill:none;stroke:#E6E6E6;stroke-width:2}
  .ttl{font:700 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#141414}
  .sub{font:400 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#8A8A8A}
  .hdr{font:700 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#FFFFFF}
  .cel{font:400 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#333333}
  .celb{font:700 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#222222}
  .h1{font:700 22px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#141414}
  .h2{font:700 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#222222}
  .p{font:400 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#9A9A9A}
  .tag{font:700 11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#FF6600;letter-spacing:1px}
</style>
<rect class="bg" width="800" height="500" rx="14"/>
<rect class="brd" x="1" y="1" width="798" height="498" rx="14"/>
<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">प्रॉम्प्ट टेम्पलेट</text><text class="p" x="40" y="132">नीचे के अनुभाग भरें। भूमिका, संदर्भ और अपेक्षित प्रारूप जितने स्पष्ट होंगे, उत्तर उतन…</text><text class="h2" x="40" y="156">भूमिका</text><text class="p" x="40" y="182">उत्तर देते समय AI कौन हो। जैसे: कड़ा तकनीकी समीक्षक, धैर्यवान शिक्षक, अनुबंध विशेषज्ञ…</text><text class="h2" x="40" y="206">संदर्भ</text><text class="p" x="40" y="232">शुरू करने से पहले क्या जानना ज़रूरी है: परियोजना, पाठक, क्या पहले आज़माया गया, क्या न…</text><text class="h2" x="40" y="256">कार्य</text><text class="p" x="40" y="282">आप क्या चाहते हैं, एक सीधे वाक्य में। एक प्रॉम्प्ट में एक अनुरोध, पाँच एक साथ से बेहत…</text><text class="h2" x="40" y="306">उत्तर का प्रारूप</text><text class="p" x="40" y="332">उत्तर किस रूप में चाहिए: तालिका, सूची, सतत पाठ, कितने शब्द, किस भाषा में।</text><text class="h2" x="40" y="356">बाधाएँ</text><text class="p" x="40" y="382">क्या टालें: जार्गन, बिना स्रोत की धारणाएँ, तय बातों को बदलना, तय लंबाई पार करना।</text><text class="h2" x="40" y="406">मैं जो चाहता हूँ उसका उदाहरण</text><text class="p" x="40" y="432">वांछित परिणाम का छोटा उदाहरण। यही उत्तर को सबसे अधिक बेहतर बनाता है और सबसे अधिक भुला…</text>
</svg>

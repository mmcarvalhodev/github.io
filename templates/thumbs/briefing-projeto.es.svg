<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Briefing de Proyecto</text><text class="p" x="40" y="132">Rellénalo antes de que alguien empiece a trabajar. Media hora aquí ahorra semanas des…</text><text class="h2" x="40" y="156">Objetivo</text><text class="p" x="40" y="182">Qué cambia en el mundo cuando este proyecto termine. Una frase.</text><text class="h2" x="40" y="206">Público</text><text class="p" x="40" y="232">Para quién es y qué sabe o no sabe esa persona.</text><text class="h2" x="40" y="256">Alcance</text><text class="p" x="40" y="282">Lo que está incluido. Sé lo bastante específico como para que alguien pueda discrepar.</text><text class="h2" x="40" y="306">Fuera del alcance</text><text class="p" x="40" y="332">Lo que NO se hará. Esta es la sección que más conflictos evita después.</text><text class="h2" x="40" y="356">Plazo y presupuesto</text><rect x="40" y="372" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="408">Criterio de éxito</text><text class="p" x="40" y="434">Cómo sabremos que salió bien; a ser posible, algo medible.</text>
</svg>

<text class="ttl" x="40" y="90">Abonelik Takibi</text><text class="sub" x="40" y="118">Her aboneliğin döngüsünü seçin. Aylık maliyet yıllıkları 12 aya böler.</text><rect x="40" y="132" width="720" height="30" fill="#FF6600" rx="3"/><text class="hdr" x="48" y="152">Hizmet</text><text class="hdr" x="208" y="152">Kategori</text><text class="hdr" x="328" y="152">Döngü</text><text class="hdr" x="416" y="152">Tutar</text><text class="hdr" x="512" y="152">Sonraki tahsil…</text><text class="hdr" x="632" y="152">Özet</text><rect x="40" y="162" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="48" y="182">Örnek: video yayını</text><text class="cel" x="208" y="182">Eğlence</text><text class="cel" x="328" y="182">Aylık</text><text class="cel" x="416" y="182">0</text><text class="cel" x="632" y="182">Aylık</text><text class="cel" x="632" y="212">Yıllık</text><rect x="40" y="222" width="720" height="30" fill="#FAFAFA"/><text class="celb" x="632" y="242">Aylık maliyet</text><text class="celb" x="632" y="272">Yıllık maliyet</text><rect x="40" y="282" width="720" height="30" fill="#FAFAFA"/><rect x="40" y="342" width="720" height="30" fill="#FAFAFA"/><rect x="40" y="132" width="720" height="270" fill="none" stroke="#EDEDED"/>

<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Registre de Décision d’Architecture</text><text class="p" x="40" y="132">Une décision par document. La valeur n’est pas dans le choix mais dans le pourquoi — …</text><text class="h2" x="40" y="156">Statut</text><text class="p" x="40" y="182">Proposée · Acceptée · Remplacée. Si remplacée, indiquez par laquelle.</text><text class="h2" x="40" y="206">Contexte</text><text class="p" x="40" y="232">Ce qui nous a obligés à décider. Contraintes réelles : délai, équipe, coût, l’existan…</text><text class="h2" x="40" y="256">Décision</text><rect x="40" y="272" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="308">Alternatives envisagées</text><text class="p" x="40" y="334">Ce qui a été évalué et pourquoi cela n’a pas été retenu. Écarter sans noter, c’est in…</text><text class="h2" x="40" y="358">Conséquences</text><text class="p" x="40" y="384">Ce qui devient plus facile et ce qui devient plus difficile. Toute décision a un prix…</text><rect x="40" y="398" width="560" height="1" fill="#E8E8E8"/>
</svg>

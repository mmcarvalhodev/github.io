<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Registro di Decisione Architetturale</text><text class="p" x="40" y="132">Una decisione per documento. Il valore non sta nella scelta ma nel perché: è ciò che …</text><text class="h2" x="40" y="156">Stato</text><text class="p" x="40" y="182">Proposta · Accettata · Sostituita. Se sostituita, indica da quale.</text><text class="h2" x="40" y="206">Contesto</text><text class="p" x="40" y="232">Cosa ci ha obbligati a decidere. Vincoli reali: scadenza, team, costo, ciò che già es…</text><text class="h2" x="40" y="256">Decisione</text><rect x="40" y="272" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="308">Alternative considerate</text><text class="p" x="40" y="334">Cosa altro è stato valutato e perché è stato scartato. Scartare senza annotare invita…</text><text class="h2" x="40" y="358">Conseguenze</text><text class="p" x="40" y="384">Cosa diventa più facile e cosa più difficile. Ogni decisione ha un prezzo: dai un nom…</text><rect x="40" y="398" width="560" height="1" fill="#E8E8E8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<style>
  .bg{fill:#FFFFFF}
  .brd{fill:none;stroke:#E6E6E6;stroke-width:2}
  .ttl{font:700 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#141414}
  .sub{font:400 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#8A8A8A}
  .hdr{font:700 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#FFFFFF}
  .cel{font:400 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#333333}
  .celb{font:700 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#222222}
  .h1{font:700 22px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#141414}
  .h2{font:700 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#222222}
  .p{font:400 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#9A9A9A}
  .tag{font:700 11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#FF6600;letter-spacing:1px}
</style>
<rect class="bg" width="800" height="500" rx="14"/>
<rect class="brd" x="1" y="1" width="798" height="498" rx="14"/>
<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Tài liệu Yêu cầu Sản phẩm (PRD)</text><text class="p" x="40" y="132">Mô tả vấn đề và kết quả mong đợi — không phải giải pháp kỹ thuật. Người triển khai qu…</text><text class="h2" x="40" y="156">Vấn đề</text><text class="p" x="40" y="182">Hôm nay điều gì gây khó, cho ai, và bao lâu một lần. Thiếu điều này, phần còn lại chỉ…</text><text class="h2" x="40" y="206">Đối tượng</text><rect x="40" y="222" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="258">Mục tiêu</text><rect x="40" y="274" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="310">Yêu cầu</text><text class="p" x="40" y="336">Cần có gì để vấn đề biến mất. Tách cái bắt buộc khỏi cái mong muốn.</text><text class="h2" x="40" y="360">Ngoài phạm vi</text><rect x="40" y="376" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="412">Chỉ số thành công</text><text class="p" x="40" y="438">Làm sao biết đã giải quyết được — tốt nhất là thứ đo được.</text>
</svg>

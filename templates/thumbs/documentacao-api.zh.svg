<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">API 文档</text><text class="p" x="40" y="132">为毫无背景的人而写，让他在五分钟内跑通第一个调用。</text><text class="h2" x="40" y="156">概览</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">认证</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">接口端点</text><text class="p" x="40" y="286">方法、路径、参数和返回内容。一个真实示例胜过三段说明。</text><text class="h2" x="40" y="310">错误</text><text class="p" x="40" y="336">各个错误码在实际中意味着什么——包括接下来该怎么做。</text><text class="h2" x="40" y="360">示例</text><rect x="40" y="376" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="412">限制与配额</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

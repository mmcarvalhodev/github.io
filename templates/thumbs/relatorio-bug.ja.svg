<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">バグ報告</text><text class="p" x="40" y="132">再現しないバグは直りません。説明よりも手順が重要です。</text><text class="h2" x="40" y="156">集計</text><text class="p" x="40" y="182">一文で：何が起きるか、本来どうあるべきか。</text><text class="h2" x="40" y="206">再現手順</text><text class="p" x="40" y="232">初期状態からエラーまで、番号を振って。読む人が製品を一度も開いたことがない前提で書きます。</text><text class="h2" x="40" y="256">期待される動作</text><rect x="40" y="272" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="308">実際の動作</text><rect x="40" y="324" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="360">環境</text><text class="p" x="40" y="386">ブラウザ、OS、バージョン、言語。多くのバグは特定の組み合わせでしか起きません。</text><text class="h2" x="40" y="410">重大度</text><rect x="40" y="426" width="560" height="1" fill="#E8E8E8"/>
</svg>

<rect class="bg" width="800" height="500" rx="14"/>
<rect class="brd" x="1" y="1" width="798" height="498" rx="14"/>
<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">学习画布</text><text class="p" x="40" y="132">学会，是能讲清楚并用得上。最后两节才是让它留下来的部分。</text><text class="h2" x="40" y="156">主题</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">用我自己的话总结</text><text class="p" x="40" y="234">照抄记不住。用自己的话重写，才能看清理解在哪里断掉。</text><text class="h2" x="40" y="258">尚未解答的问题</text><rect x="40" y="274" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="310">示例</text><rect x="40" y="326" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="362">关联</text><text class="p" x="40" y="388">在你已知的东西里，这像什么。知识就是这样黏住的。</text><text class="h2" x="40" y="412">行动</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

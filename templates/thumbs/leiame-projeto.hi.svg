<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">प्रोजेक्ट README</text><text class="p" x="40" y="132">पहली तीन पंक्तियाँ तय करती हैं कि कोई पढ़ता रहेगा या नहीं। शुरू करें कि यह क्या है और…</text><text class="h2" x="40" y="156">यह क्या है</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">कैसे इंस्टॉल करें</text><text class="p" x="40" y="234">सटीक कमांड, क्रम में। कोई निहित चरण नहीं।</text><text class="h2" x="40" y="258">कैसे उपयोग करें</text><rect x="40" y="274" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="310">कॉन्फ़िगरेशन</text><rect x="40" y="326" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="362">योगदान कैसे करें</text><rect x="40" y="378" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="414">लाइसेंस</text><rect x="40" y="430" width="560" height="1" fill="#E8E8E8"/>
</svg>

<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Architettura Software</text><text class="p" x="40" y="132">La mappa che chi arriva legge prima di toccare il codice. Meglio poche caselle spiega…</text><text class="h2" x="40" y="156">Panoramica</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Componenti</text><text class="p" x="40" y="234">Cosa fa ogni parte e, soprattutto, cosa non fa.</text><text class="h2" x="40" y="258">Flusso dei dati</text><text class="p" x="40" y="284">Da dove entra l’informazione, dove è conservata e da dove esce.</text><text class="h2" x="40" y="308">Decisioni tecniche</text><text class="p" x="40" y="334">Le scelte che modellano tutto il resto. Ognuna merita il proprio registro di decision…</text><text class="h2" x="40" y="358">Rischi</text><rect x="40" y="374" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="410">Cosa non è ancora risolto</text><rect x="40" y="426" width="560" height="1" fill="#E8E8E8"/>
</svg>

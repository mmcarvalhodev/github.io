<text class="h1" x="40" y="96">Arquitectura de Software</text><text class="p" x="40" y="132">El mapa que alguien nuevo lee antes de tocar el código. Prefiere pocas cajas bien exp…</text><text class="h2" x="40" y="156">Visión general</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Componentes</text><text class="p" x="40" y="234">Qué hace cada parte y, sobre todo, qué no hace.</text><text class="h2" x="40" y="258">Flujo de datos</text><text class="p" x="40" y="284">Por dónde entra la información, dónde se guarda y por dónde sale.</text><text class="h2" x="40" y="308">Decisiones técnicas</text><text class="p" x="40" y="334">Las elecciones que moldean todo lo demás. Cada una merece su propio registro de decis…</text><text class="h2" x="40" y="358">Riesgos</text><rect x="40" y="374" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="410">Lo que aún no está resuelto</text><rect x="40" y="426" width="560" height="1" fill="#E8E8E8"/>
</svg>

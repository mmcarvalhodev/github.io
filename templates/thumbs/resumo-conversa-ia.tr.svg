<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Yapay Zekâ Sohbet Özeti</text><text class="p" x="40" y="132">Uzun bir sohbet, geriye kayıt değil karar kaldığında değer kazanır. Bağlam tazeyken, …</text><text class="h2" x="40" y="156">Konu</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Model ve tarih</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">Neyi çözmek istedim</text><rect x="40" y="276" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="312">Ana noktalar</text><text class="p" x="40" y="338">Bir ay sonra da hatırlamaya değer fikirler — sohbetin adım adım akışı değil.</text><text class="h2" x="40" y="362">Alınan kararlar</text><text class="p" x="40" y="388">Neye karar verildi ve neden. Gerekçeyi yazmak, aynı tartışmayı sonra tekrarlamanı önl…</text><text class="h2" x="40" y="412">Açık kalanlar</text><text class="p" x="40" y="438">Sohbetin kapatmadığı, daha fazla bilgi ya da başka birini gerektiren sorular.</text>
</svg>

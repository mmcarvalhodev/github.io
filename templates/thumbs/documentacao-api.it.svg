<text class="h1" x="40" y="96">Documentazione API</text><text class="p" x="40" y="132">Scrivi per chi arriva senza contesto e deve avere la prima chiamata funzionante in ci…</text><text class="h2" x="40" y="156">Panoramica</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Autenticazione</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">Endpoint</text><text class="p" x="40" y="286">Metodo, percorso, parametri e cosa torna. Un esempio reale vale più di tre paragrafi.</text><text class="h2" x="40" y="310">Errori</text><text class="p" x="40" y="336">I codici e cosa significa ciascuno in pratica, incluso cosa fare dopo.</text><text class="h2" x="40" y="360">Esempi</text><rect x="40" y="376" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="412">Limiti e quote</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

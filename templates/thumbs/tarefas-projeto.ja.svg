<text class="ttl" x="40" y="90">プロジェクトタスク一覧</text><text class="sub" x="40" y="118">ステータスは「未着手・進行中・完了」を使います。右のパネルが自動で集計します。</text><rect x="40" y="132" width="720" height="30" fill="#FF6600" rx="3"/><text class="hdr" x="48" y="152">タスク</text><text class="hdr" x="270.680412371134" y="152">担当者</text><text class="hdr" x="382.02061855670104" y="152">ステータス</text><text class="hdr" x="478.5154639175258" y="152">優先度</text><text class="hdr" x="567.5876288659794" y="152">期限</text><text class="hdr" x="656.659793814433" y="152">状況</text><rect x="40" y="162" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="48" y="182">例：プロジェクトの範囲を決める</text><text class="cel" x="382.02061855670104" y="182">未着手</text><text class="cel" x="478.5154639175258" y="182">高</text><text class="cel" x="656.659793814433" y="182">未着手</text><text class="cel" x="656.659793814433" y="212">進行中</text><rect x="40" y="222" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="656.659793814433" y="242">完了</text><text class="celb" x="656.659793814433" y="272">合計</text><rect x="40" y="282" width="720" height="30" fill="#FAFAFA"/><text class="celb" x="656.659793814433" y="302">完了率 (%)</text><rect x="40" y="342" width="720" height="30" fill="#FAFAFA"/><rect x="40" y="132" width="720" height="270" fill="none" stroke="#EDEDED"/>

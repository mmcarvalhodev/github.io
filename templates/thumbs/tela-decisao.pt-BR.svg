<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Tela de Decisão</text><text class="p" x="40" y="132">Para decisões que você vai precisar justificar depois — inclusive para si mesmo.</text><text class="h2" x="40" y="156">Decisão a tomar</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">A favor</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">Contra</text><rect x="40" y="276" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="312">Riscos</text><text class="p" x="40" y="338">O que pode dar errado e quanto custaria. Risco sem custo estimado não ajuda a decidir.</text><text class="h2" x="40" y="362">Impacto</text><text class="p" x="40" y="388">Em quem e em quê. Decisão reversível merece menos análise que decisão definitiva.</text><text class="h2" x="40" y="412">Decisão final</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

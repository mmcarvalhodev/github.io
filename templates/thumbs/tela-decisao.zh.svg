<rect class="bg" width="800" height="500" rx="14"/>
<rect class="brd" x="1" y="1" width="798" height="498" rx="14"/>
<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">决策画布</text><text class="p" x="40" y="132">用于日后需要说明理由的决定——包括对你自己。</text><text class="h2" x="40" y="156">要做的决定</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">支持</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">反对</text><rect x="40" y="276" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="312">风险</text><text class="p" x="40" y="338">可能出什么问题，代价有多大。没有估算成本的风险，帮不了决策。</text><text class="h2" x="40" y="362">影响</text><text class="p" x="40" y="388">影响谁、影响什么。可逆的决定不需要像不可逆的那样反复分析。</text><text class="h2" x="40" y="412">最终决定</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

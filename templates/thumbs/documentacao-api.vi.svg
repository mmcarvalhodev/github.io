<rect class="bg" width="800" height="500" rx="14"/>
<rect class="brd" x="1" y="1" width="798" height="498" rx="14"/>
<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Tài liệu API</text><text class="p" x="40" y="132">Viết cho người đến mà không có bối cảnh và cần lệnh gọi đầu tiên chạy được trong năm …</text><text class="h2" x="40" y="156">Tổng quan</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Xác thực</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">Điểm cuối</text><text class="p" x="40" y="286">Phương thức, đường dẫn, tham số và thứ trả về. Một ví dụ thật hơn ba đoạn văn.</text><text class="h2" x="40" y="310">Lỗi</text><text class="p" x="40" y="336">Các mã lỗi và ý nghĩa thực tế của từng mã — kể cả nên làm gì tiếp theo.</text><text class="h2" x="40" y="360">Ví dụ</text><rect x="40" y="376" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="412">Giới hạn và hạn mức</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Kanwa myślenia</text><text class="p" x="40" y="132">Do myślenia na piśmie przed decyzją. Oddzielenie faktu od założenia to już połowa pra…</text><text class="h2" x="40" y="156">Problem</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Znane fakty</text><text class="p" x="40" y="234">Tylko to, co potrafisz uzasadnić. Jeśli potrzebne jest „wydaje mi się”, to niżej.</text><text class="h2" x="40" y="258">Założenia</text><text class="p" x="40" y="284">Co przyjmujesz za prawdę bez sprawdzenia. Oznaczenie tego chroni przed budowaniem na …</text><text class="h2" x="40" y="308">Alternatywy</text><rect x="40" y="324" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="360">Decyzja</text><rect x="40" y="376" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="412">Następny krok</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

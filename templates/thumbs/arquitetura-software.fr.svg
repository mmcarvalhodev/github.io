<text class="h1" x="40" y="96">Architecture Logicielle</text><text class="p" x="40" y="132">La carte qu’un nouveau lit avant de toucher au code. Préférez quelques boîtes bien ex…</text><text class="h2" x="40" y="156">Vue d’ensemble</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Composants</text><text class="p" x="40" y="234">Ce que fait chaque partie et surtout ce qu’elle ne fait pas.</text><text class="h2" x="40" y="258">Flux de données</text><text class="p" x="40" y="284">Par où l’information entre, où elle est stockée et par où elle sort.</text><text class="h2" x="40" y="308">Décisions techniques</text><text class="p" x="40" y="334">Les choix qui façonnent tout le reste. Chacun mérite son propre registre de décision.</text><text class="h2" x="40" y="358">Risques</text><rect x="40" y="374" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="410">Ce qui n’est pas encore tranché</text><rect x="40" y="426" width="560" height="1" fill="#E8E8E8"/>

<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">AI作業キャンバス</text><text class="p" x="40" y="132">1つのキャンバスに1サイクル：依頼・受領・評価・決定。AIを使うと失われるのは、まさに自分の判断の記録です。</text><text class="h2" x="40" y="156">目的</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">文脈</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">プロンプト</text><rect x="40" y="276" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="312">出力</text><rect x="40" y="328" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="364">評価</text><text class="p" x="40" y="390">良かった点、誤っていた点、作り話だった点。この項目が「使う」を「学ぶ」に変えます。</text><text class="h2" x="40" y="414">決定</text><rect x="40" y="430" width="560" height="1" fill="#E8E8E8"/>
</svg>

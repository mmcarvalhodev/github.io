<text class="h1" x="40" y="96">Denk-Canvas</text><text class="p" x="40" y="132">Um vor der Entscheidung schriftlich zu denken. Fakt von Annahme zu trennen ist schon …</text><text class="h2" x="40" y="156">Problem</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Bekannte Fakten</text><text class="p" x="40" y="234">Nur was Sie belegen können. Wenn ein „ich glaube“ nötig ist, gehört es in den Abschni…</text><text class="h2" x="40" y="258">Annahmen</text><text class="p" x="40" y="284">Was Sie ungeprüft für wahr halten. Das zu markieren verhindert, auf Sand zu bauen.</text><text class="h2" x="40" y="308">Alternativen</text><rect x="40" y="324" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="360">Entscheidung</text><rect x="40" y="376" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="412">Nächster Schritt</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>

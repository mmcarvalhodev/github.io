<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">API 문서</text><text class="p" x="40" y="132">아무 맥락 없이 온 사람이 5분 안에 첫 호출을 성공시킬 수 있도록 쓰세요.</text><text class="h2" x="40" y="156">개요</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">인증</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">엔드포인트</text><text class="p" x="40" y="286">메서드, 경로, 파라미터, 반환값. 실제 예시 하나가 설명 세 문단보다 낫습니다.</text><text class="h2" x="40" y="310">오류</text><text class="p" x="40" y="336">코드와 각각이 실제로 뜻하는 것 — 다음에 무엇을 할지까지.</text><text class="h2" x="40" y="360">예시</text><rect x="40" y="376" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="412">제한과 할당량</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

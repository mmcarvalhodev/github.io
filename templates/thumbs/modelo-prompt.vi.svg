<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Mẫu Prompt</text><text class="p" x="40" y="132">Điền các phần bên dưới. Vai trò, ngữ cảnh và định dạng mong muốn càng rõ thì câu trả …</text><text class="h2" x="40" y="156">Vai trò</text><text class="p" x="40" y="182">AI nên đóng vai ai khi trả lời. Ví dụ: người rà soát kỹ thuật khó tính, giáo viên kiê…</text><text class="h2" x="40" y="206">Ngữ cảnh</text><text class="p" x="40" y="232">Điều cần biết trước khi bắt đầu: dự án, đối tượng, những gì đã thử, những gì không đư…</text><text class="h2" x="40" y="256">Công việc</text><text class="p" x="40" y="282">Bạn muốn gì, trong một câu trực tiếp. Một yêu cầu mỗi prompt thường hiệu quả hơn năm …</text><text class="h2" x="40" y="306">Định dạng câu trả lời</text><text class="p" x="40" y="332">Câu trả lời cần ở dạng nào: bảng, danh sách, văn xuôi, bao nhiêu từ, bằng ngôn ngữ nà…</text><text class="h2" x="40" y="356">Ràng buộc</text><text class="p" x="40" y="382">Cần tránh: biệt ngữ, phỏng đoán không nguồn, thay đổi điều đã chốt, vượt quá độ dài.</text><text class="h2" x="40" y="406">Ví dụ về điều tôi mong đợi</text><text class="p" x="40" y="432">Một ví dụ ngắn về kết quả mong muốn. Đây là thứ cải thiện câu trả lời nhiều nhất và c…</text>
</svg>

<text class="ttl" x="40" y="90">订阅管理</text><text class="sub" x="40" y="118">为每个订阅选择计费周期。月度成本已将年费分摊到 12 个月。</text><rect x="40" y="132" width="720" height="30" fill="#FF6600" rx="3"/><text class="hdr" x="48" y="152">服务</text><text class="hdr" x="208" y="152">类别</text><text class="hdr" x="328" y="152">周期</text><text class="hdr" x="416" y="152">金额</text><text class="hdr" x="512" y="152">下次扣款</text><text class="hdr" x="632" y="152">汇总</text><rect x="40" y="162" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="48" y="182">示例：视频流媒体</text><text class="cel" x="208" y="182">休闲</text><text class="cel" x="328" y="182">每月</text><text class="cel" x="416" y="182">0</text><text class="cel" x="632" y="182">每月</text><text class="cel" x="632" y="212">每年</text><rect x="40" y="222" width="720" height="30" fill="#FAFAFA"/><text class="celb" x="632" y="242">每月成本</text><text class="celb" x="632" y="272">每年成本</text><rect x="40" y="282" width="720" height="30" fill="#FAFAFA"/><rect x="40" y="342" width="720" height="30" fill="#FAFAFA"/><rect x="40" y="132" width="720" height="270" fill="none" stroke="#EDEDED"/>

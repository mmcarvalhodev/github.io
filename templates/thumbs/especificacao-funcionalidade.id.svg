<rect class="bg" width="800" height="500" rx="14"/>
<rect class="brd" x="1" y="1" width="798" height="498" rx="14"/>
<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Spesifikasi Fitur</text><text class="p" x="40" y="132">Merinci perilaku sedetail itu sampai dua orang membangunnya sama tanpa berdiskusi.</text><text class="h2" x="40" y="156">Ringkasan</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Perilaku yang diharapkan</text><text class="p" x="40" y="234">Alur normal, langkah demi langkah, dari sudut pandang pengguna.</text><text class="h2" x="40" y="258">Kasus tepi</text><text class="p" x="40" y="284">Kosong, terlalu besar, offline, tanpa izin, dua kali berturut-turut. Di sinilah spesi…</text><text class="h2" x="40" y="308">Dampak</text><text class="p" x="40" y="334">Apa lagi dalam produk yang berubah karena ini.</text><text class="h2" x="40" y="358">Kriteria penerimaan</text><rect x="40" y="374" width="560" height="1" fill="#E8E8E8"/><rect x="40" y="400" width="560" height="1" fill="#E8E8E8"/>
</svg>

<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">AI Conversation Summary</text><text class="p" x="40" y="132">A long conversation becomes valuable when what is left is decisions, not transcript. …</text><text class="h2" x="40" y="156">Topic</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Model and date</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">What I wanted to solve</text><rect x="40" y="276" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="312">Key points</text><text class="p" x="40" y="338">The ideas worth remembering a month from now — not the step-by-step of the conversati…</text><text class="h2" x="40" y="362">Decisions made</text><text class="p" x="40" y="388">What was decided, and why. Writing down the reason saves you from re-arguing it later.</text><text class="h2" x="40" y="412">Still open</text><text class="p" x="40" y="438">Questions the conversation did not close, needing more information or someone else.</text>

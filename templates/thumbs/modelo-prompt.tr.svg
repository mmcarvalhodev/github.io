<text class="h1" x="40" y="96">Prompt Şablonu</text><text class="p" x="40" y="132">Aşağıdaki bölümleri doldurun. Rol, bağlam ve beklenen biçim ne kadar netse yanıt o ka…</text><text class="h2" x="40" y="156">Rol</text><text class="p" x="40" y="182">Yanıt verirken yapay zekânın kim olması gerektiği. Örn.: titiz bir teknik denetçi, sa…</text><text class="h2" x="40" y="206">Bağlam</text><text class="p" x="40" y="232">Başlamadan önce bilmesi gerekenler: proje, hedef kitle, daha önce denenenler, değişme…</text><text class="h2" x="40" y="256">Görev</text><text class="p" x="40" y="282">Ne istediğinizi tek ve doğrudan bir cümleyle yazın. Prompt başına tek istek, beş iste…</text><text class="h2" x="40" y="306">Yanıt biçimi</text><text class="p" x="40" y="332">Yanıtın nasıl gelmesi gerektiği: tablo, liste, düz metin, kaç kelime, hangi dilde.</text><text class="h2" x="40" y="356">Kısıtlar</text><text class="p" x="40" y="382">Kaçınılacaklar: jargon, kaynaksız varsayımlar, kararlaştırılanı değiştirmek, uzunluğu…</text><text class="h2" x="40" y="406">Beklediğim sonuca örnek</text><text class="p" x="40" y="432">İstenen sonucun kısa bir örneği. Yanıtı en çok iyileştiren ve en sık yazılmayı unutul…</text>

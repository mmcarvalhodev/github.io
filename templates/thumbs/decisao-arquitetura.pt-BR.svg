<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Registro de Decisão de Arquitetura</text><text class="p" x="40" y="132">Uma decisão por documento. O valor não está na escolha, está no porquê — é isso que e…</text><text class="h2" x="40" y="156">Status</text><text class="p" x="40" y="182">Proposta · Aceita · Substituída. Se foi substituída, aponte por qual.</text><text class="h2" x="40" y="206">Contexto</text><text class="p" x="40" y="232">O que nos obrigou a decidir. Restrições reais: prazo, equipe, custo, o que já existe.</text><text class="h2" x="40" y="256">Decisão</text><rect x="40" y="272" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="308">Alternativas consideradas</text><text class="p" x="40" y="334">O que mais foi avaliado e por que não foi escolhido. Descartar sem registrar convida …</text><text class="h2" x="40" y="358">Consequências</text><text class="p" x="40" y="384">O que fica mais fácil e o que fica mais difícil. Toda decisão cobra um preço — nomeie…</text><rect x="40" y="398" width="560" height="1" fill="#E8E8E8"/>
</svg>

<text class="ttl" x="40" y="90">Gider Takibi</text><text class="sub" x="40" y="118">Her gideri bir satıra girin. Sağdaki özet kategoriye göre kendiliğinden toplar.</text><rect x="40" y="132" width="720" height="30" fill="#FF6600" rx="3"/><text class="hdr" x="48" y="152">Tarih</text><text class="hdr" x="129.64948453608247" y="152">Açıklama</text><text class="hdr" x="322.63917525773195" y="152">Kategori</text><text class="hdr" x="433.97938144329896" y="152">Ödeme</text><text class="hdr" x="545.319587628866" y="152">Tutar</text><text class="hdr" x="641.8144329896907" y="152">Kategoriye gör…</text><rect x="40" y="162" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="129.64948453608247" y="182">Örnek: haftalık market</text><text class="cel" x="322.63917525773195" y="182">Gıda</text><text class="cel" x="433.97938144329896" y="182">Banka kartı</text><text class="cel" x="545.319587628866" y="182">0</text><text class="cel" x="641.8144329896907" y="182">Konut</text><text class="cel" x="641.8144329896907" y="212">Gıda</text><rect x="40" y="222" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="641.8144329896907" y="242">Ulaşım</text><text class="cel" x="641.8144329896907" y="272">Sağlık</text><rect x="40" y="282" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="641.8144329896907" y="302">Eğitim</text><text class="cel" x="641.8144329896907" y="332">Eğlence</text><rect x="40" y="342" width="720" height="30" fill="#FAFAFA"/><text class="cel" x="641.8144329896907" y="362">Abonelikler</text><text class="cel" x="641.8144329896907" y="392">Diğer</text><rect x="40" y="132" width="720" height="270" fill="none" stroke="#EDEDED"/>

<rect class="bg" width="800" height="500" rx="14"/>
<rect class="brd" x="1" y="1" width="798" height="498" rx="14"/>
<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">意思決定キャンバス</text><text class="p" x="40" y="132">後で説明を求められる決定のために。自分自身に対しても。</text><text class="h2" x="40" y="156">決めること</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">賛成</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">反対</text><rect x="40" y="276" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="312">リスク</text><text class="p" x="40" y="338">何がうまくいかない可能性があり、いくらかかるか。費用の見積もりのないリスクは判断の役に立ちません。</text><text class="h2" x="40" y="362">影響</text><text class="p" x="40" y="388">誰に、何に影響するか。取り消せる決定は、取り消せない決定ほど分析を要しません。</text><text class="h2" x="40" y="412">最終決定</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Specifica di Funzionalità</text><text class="p" x="40" y="132">Dettaglia il comportamento al punto che due persone lo implementerebbero uguale senza…</text><text class="h2" x="40" y="156">Riepilogo</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Comportamento atteso</text><text class="p" x="40" y="234">Il percorso ideale, passo per passo, dal punto di vista di chi usa.</text><text class="h2" x="40" y="258">Casi limite</text><text class="p" x="40" y="284">Vuoto, troppo grande, offline, senza permesso, due volte di seguito. È qui che la spe…</text><text class="h2" x="40" y="308">Impatto</text><text class="p" x="40" y="334">Cos’altro cambia nel prodotto a causa di questo.</text><text class="h2" x="40" y="358">Criteri di accettazione</text><rect x="40" y="374" width="560" height="1" fill="#E8E8E8"/><rect x="40" y="400" width="560" height="1" fill="#E8E8E8"/>
</svg>

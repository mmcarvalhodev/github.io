<text class="h1" x="40" y="96">Catatan Keputusan Arsitektur</text><text class="p" x="40" y="132">Satu keputusan per dokumen. Nilainya bukan pada pilihan, tetapi pada alasannya — itul…</text><text class="h2" x="40" y="156">Status</text><text class="p" x="40" y="182">Diusulkan · Diterima · Digantikan. Jika digantikan, sebutkan penggantinya.</text><text class="h2" x="40" y="206">Konteks</text><text class="p" x="40" y="232">Apa yang memaksa kita memutuskan. Batasan nyata: tenggat, tim, biaya, yang sudah ada.</text><text class="h2" x="40" y="256">Keputusan</text><rect x="40" y="272" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="308">Alternatif yang dipertimbangkan</text><text class="p" x="40" y="334">Apa lagi yang dinilai dan mengapa tidak dipilih. Membuang tanpa mencatat mengundang p…</text><text class="h2" x="40" y="358">Konsekuensi</text><text class="p" x="40" y="384">Apa yang jadi lebih mudah dan apa yang jadi lebih sulit. Setiap keputusan ada hargany…</text><rect x="40" y="398" width="560" height="1" fill="#E8E8E8"/>
</svg>

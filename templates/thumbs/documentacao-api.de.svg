<text class="h1" x="40" y="96">API-Dokumentation</text><text class="p" x="40" y="132">Schreiben Sie für jemanden ohne Vorwissen, der in fünf Minuten den ersten Aufruf zum …</text><text class="h2" x="40" y="156">Überblick</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Authentifizierung</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">Endpunkte</text><text class="p" x="40" y="286">Methode, Pfad, Parameter und was zurückkommt. Ein echtes Beispiel schlägt drei Absätz…</text><text class="h2" x="40" y="310">Fehler</text><text class="p" x="40" y="336">Die Codes und was jeder praktisch bedeutet — samt dem nächsten Schritt.</text><text class="h2" x="40" y="360">Beispiele</text><rect x="40" y="376" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="412">Limits und Kontingente</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>

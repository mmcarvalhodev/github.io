<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">Laporan Status Mingguan</text><text class="p" x="40" y="132">Satu halaman per minggu. Pembaca harus paham situasinya dalam semenit, tanpa perlu be…</text><text class="h2" x="40" y="156">Periode</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Yang maju</text><text class="p" x="40" y="234">Hasil, bukan aktivitas. &quot;Pendaftaran sudah aktif&quot; lebih berarti daripada &quot;saya menger…</text><text class="h2" x="40" y="258">Yang macet</text><text class="p" x="40" y="284">Apa yang tidak bergerak dan mengapa. Menyembunyikannya hanya menunda masalah.</text><text class="h2" x="40" y="308">Risiko</text><text class="p" x="40" y="334">Yang belum jadi masalah tetapi bisa jadi masalah. Lebih baik diberitahukan sejak awal.</text><text class="h2" x="40" y="358">Saya butuh bantuan untuk</text><text class="p" x="40" y="384">Keputusan, akses, atau orang yang butuh pihak lain untuk membukanya.</text><text class="h2" x="40" y="408">Minggu depan</text><rect x="40" y="424" width="560" height="1" fill="#E8E8E8"/>
</svg>

</style>
<rect class="bg" width="800" height="500" rx="14"/>
<rect class="brd" x="1" y="1" width="798" height="498" rx="14"/>
<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">AI会話のまとめ</text><text class="p" x="40" y="132">長い会話が価値になるのは、履歴ではなく決定が残るときです。文脈が新しいうちに、会話の直後に記入しましょう。</text><text class="h2" x="40" y="156">主題</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">モデルと日付</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">解決したかったこと</text><rect x="40" y="276" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="312">要点</text><text class="p" x="40" y="338">1か月後にも覚えておきたい考え。会話の逐一の流れではありません。</text><text class="h2" x="40" y="362">決めたこと</text><text class="p" x="40" y="388">何を決めたか、そしてなぜか。理由を残すと、後で同じ議論を繰り返さずに済みます。</text><text class="h2" x="40" y="412">未解決のこと</text><text class="p" x="40" y="438">会話で決着しなかった疑問。追加の情報や別の人が必要なもの。</text>
</svg>

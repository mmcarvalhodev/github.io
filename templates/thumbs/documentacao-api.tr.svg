<text class="tag" x="40" y="44">NODUS WORKSPACE · DOCUMENTO</text>
<text class="h1" x="40" y="96">API Dokümantasyonu</text><text class="p" x="40" y="132">Bağlamı olmayan ve beş dakikada ilk çağrıyı çalıştırması gereken biri için yazın.</text><text class="h2" x="40" y="156">Genel bakış</text><rect x="40" y="172" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="208">Kimlik doğrulama</text><rect x="40" y="224" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="260">Uç noktalar</text><text class="p" x="40" y="286">Metot, yol, parametreler ve ne döndüğü. Bir gerçek örnek, üç paragraftan iyidir.</text><text class="h2" x="40" y="310">Hatalar</text><text class="p" x="40" y="336">Kodlar ve her birinin pratikte anlamı — sonra ne yapılacağı dâhil.</text><text class="h2" x="40" y="360">Örnekler</text><rect x="40" y="376" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="412">Limitler ve kotalar</text><rect x="40" y="428" width="560" height="1" fill="#E8E8E8"/>
</svg>

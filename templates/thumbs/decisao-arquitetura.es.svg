<text class="h1" x="40" y="96">Registro de Decisión de Arquitectura</text><text class="p" x="40" y="132">Una decisión por documento. El valor no está en la elección, sino en el porqué: eso e…</text><text class="h2" x="40" y="156">Estado</text><text class="p" x="40" y="182">Propuesta · Aceptada · Sustituida. Si fue sustituida, indica por cuál.</text><text class="h2" x="40" y="206">Contexto</text><text class="p" x="40" y="232">Qué nos obligó a decidir. Restricciones reales: plazo, equipo, coste, lo que ya exist…</text><text class="h2" x="40" y="256">Decisión</text><rect x="40" y="272" width="560" height="1" fill="#E8E8E8"/><text class="h2" x="40" y="308">Alternativas consideradas</text><text class="p" x="40" y="334">Qué más se evaluó y por qué no se eligió. Descartar sin registrar invita a revisitarl…</text><text class="h2" x="40" y="358">Consecuencias</text><text class="p" x="40" y="384">Qué se vuelve más fácil y qué más difícil. Toda decisión cobra un precio: nombra el t…</text><rect x="40" y="398" width="560" height="1" fill="#E8E8E8"/>
